<title>Visor DrenIE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Espacio modelo de CAD a pantalla completa: cinta de iconos arriba, paneles y propiedades a la izquierda,
   linea de comando y barra de estado abajo. Mismo aspecto claro que DrenIE (Poppins, azul marino y celeste). */
:root {
  --bg: #ffffff;          /* espacio modelo */
  --panel: #F3F7FB;       /* barras y paneles */
  --panel-2: #ffffff;
  --line: #DCE6F0;
  --fg: #0B2545;
  --muted: #5C7390;
  --accent: #1EA7F2;      /* comando activo, botones principales */
  --accent-2: #0B6FC0;
  --sel: #0B6FC0;         /* seleccion y pinzamientos */
  --cota: #0B6FC0;        /* cotas */
  --warn: #D61F9A;        /* areas sin asignar, observaciones */
  --ok: #12A36A;
  --font-ui: "Poppins", "Segoe UI", Arial, sans-serif;
  --font-mono: "Consolas", "Cascadia Mono", ui-monospace, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.35 var(--font-ui); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.app > * { min-width: 0; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marca { font-weight: 600; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; margin-right: 4px; }
.marca small { color: var(--muted); font-weight: 400; }
.grupo { display: flex; align-items: center; gap: 2px; padding-right: 8px; border-right: 1px solid var(--line); }
.grupo:last-child { border-right: 0; }
.grupo > span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; margin-right: 4px; }
button { font: 500 12px var(--font-ui); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 8px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
button:hover { border-color: #9FD4FA; background: #E8F4FE; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.ico { width: 30px; height: 28px; padding: 0; justify-content: center; background: transparent; border-color: transparent; }
button.ico:hover { background: var(--panel-2); border-color: var(--line); }
button.ico svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
button.on { border-color: #9FD4FA; color: var(--accent-2); background: #DCEFFD; }
button.activo { background: var(--accent); color: #fff; border-color: var(--accent); }
.cuerpo { display: grid; grid-template-columns: 272px 1fr; min-height: 0; }
.lado { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pestanas { display: flex; border-bottom: 1px solid var(--line); }
.pestanas button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; justify-content: center; color: var(--muted); }
.pestanas button.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.hoja { overflow: auto; padding: 10px 12px; flex: 1; min-height: 0; }
.props { border-top: 1px solid var(--line); padding: 10px 12px; max-height: 46%; overflow: auto; background: var(--panel); flex: none; }
.capa { display: grid; grid-template-columns: 16px 10px 1fr auto; gap: 7px; align-items: center; padding: 2px 0; font-size: 12px; }
.capa i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.capa label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.capa small { color: var(--muted); font: 11px var(--font-mono); }
.tabla { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tabla td, .tabla th { padding: 4px 2px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; vertical-align: top; }
.tabla td.n, .tabla th.n { text-align: right; font-family: var(--font-mono); }
.tabla th { color: var(--muted); font-weight: 500; }
.tabla i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ficha td:first-child { color: var(--muted); width: 42%; }
.ficha td:last-child { font-family: var(--font-mono); word-break: break-word; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
h3:first-child { margin-top: 0; }
.nota { color: var(--muted); font-size: 12px; margin: 6px 0; }
.lista-sin button { width: 100%; justify-content: space-between; margin-bottom: 4px; }
.fila { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
select, .filtro { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 12px var(--font-ui); padding: 4px 6px; }
textarea { width: 100%; min-height: 110px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 11px var(--font-mono); padding: 6px; }
.lienzo { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
.lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#capaSup { cursor: none; }
.tip { position: absolute; z-index: 4; pointer-events: none; background: rgba(255, 255, 255, .96); box-shadow: 0 4px 12px rgba(11,37,69,.12); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 7px; font: 11px/1.4 var(--font-mono); color: var(--fg); white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.tip b { color: var(--accent-2); font-weight: 500; }
.tip small { display: block; color: var(--muted); font-size: 10px; }
.paleta { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; width: 300px; max-width: calc(100% - 20px); box-shadow: 0 8px 24px rgba(11,37,69,.16); }
.paleta p { grid-column: 1 / -1; margin: 0 0 4px; color: var(--muted); font-size: 12px; }
.paleta button { justify-content: flex-start; }
.paleta button i, .muestra { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
.paleta kbd { margin-left: auto; font: 11px var(--font-mono); color: var(--muted); }
.ayuda { position: absolute; z-index: 7; inset: 12px; max-width: 640px; margin: auto; height: fit-content; max-height: calc(100% - 24px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 12px 32px rgba(11,37,69,.18); }
.ayuda table { width: 100%; border-collapse: collapse; }
.ayuda td { padding: 3px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
.ayuda td:first-child { font-family: var(--font-mono); color: var(--accent-2); white-space: nowrap; }
.app-btn { display: none; }
body.modo-app .app-btn { display: inline-flex; }
body.modo-drenie .barra { display: none; }
body.modo-drenie .app { grid-template-rows: 1fr auto; }
button.calc { background: linear-gradient(120deg, #1EA7F2, #0B6FC0); color: #fff; border-color: #1492DF; font-weight: 600; }
.velo { position: fixed; inset: 0; background: rgba(11, 37, 69, .35); display: grid; place-items: center; z-index: 20; }
.velo > div { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 26px; min-width: min(380px, 90vw); text-align: center; }
.velo b { display: block; margin-bottom: 6px; }
.velo small { color: var(--muted); font-family: var(--font-mono); }
.barra-p { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 12px; }
.barra-p i { display: block; height: 100%; width: 40%; background: var(--accent); animation: ir 1.3s ease-in-out infinite; }
@keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { .barra-p i { animation: none; width: 100%; } }
.entreg td { padding: 4px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
.entreg td:last-child { text-align: right; }
.sol-btn { border-color: var(--warn); color: var(--fg); }
.sol-btn b { background: var(--warn); color: #fff; border-radius: 9px; padding: 0 6px; font: 600 11px var(--font-mono); }
.sol-ven { max-width: 760px; }
.sol-tar { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 10px 0; background: var(--panel-2); }
.sol-tar h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; text-wrap: balance; }
.sol-tar p { margin: 3px 0; font-size: 12px; }
.sol-tar p small { color: var(--muted); }
.sol-chip { display: inline-block; font: 600 10px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.sol-chip.decision { background: #0B6FC0; color: #fff; }
.sol-chip.revisar { background: var(--warn); color: #fff; }
.sol-chip.confirmar { background: #E08A12; color: #fff; }
.sol-chip.hecho { background: var(--ok); color: #fff; }
.sol-ops { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.sol-ops button { justify-content: flex-start; text-align: left; white-space: normal; }
.sol-ops button small { color: var(--muted); display: block; font-weight: 400; }
.sol-ops button.elegida { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.sol-ops button.recom::after { content: "recomendada"; margin-left: auto; font: 600 10px var(--font-ui); color: var(--accent-2); text-transform: uppercase; letter-spacing: .06em; }
.pie { background: var(--panel); border-top: 1px solid var(--line); position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.historial { font: 12px var(--font-mono); color: var(--muted); height: 36px; overflow: auto; padding-top: 3px; white-space: pre-wrap; }
.linea-cmd { display: flex; align-items: center; gap: 8px; padding: 3px 0; position: relative; }
.linea-cmd b { font: 500 12px var(--font-mono); color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
.linea-cmd input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 13px var(--font-mono); padding: 4px 8px; }
.sug { position: absolute; bottom: 100%; right: 0; z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 240px; padding: 3px; }
.sug div { padding: 3px 8px; font: 12px var(--font-mono); cursor: pointer; display: flex; gap: 10px; }
.sug div span { color: var(--muted); font-family: var(--font-ui); }
.sug div.on, .sug div:hover { background: var(--panel-2); }
.estado { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font: 11px var(--font-mono); color: var(--muted); padding: 2px 0 6px; font-variant-numeric: tabular-nums; }
.estado button { padding: 2px 6px; font: 11px var(--font-mono); }
#coord { min-width: 250px; }
.mostrar-lado { display: none; }
.tactil { display: none; }
@media (pointer: coarse) { .tactil { display: inline-flex; } .estado button { padding: 6px 10px; font-size: 12px; } }
@media (max-width: 760px) {
  .barra { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .barra::-webkit-scrollbar { display: none; }
  .grupo, .marca { flex: none; }
  button.ico { width: 36px; height: 34px; }
  .historial { height: 18px; }
  .estado { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .estado > * { flex: none; }
  #coord, #modoSnap, #btnTxt, #btnAyuda { display: none; }
  .cuerpo { grid-template-columns: 1fr; position: relative; }
  .lado { position: absolute; z-index: 6; top: 0; bottom: 0; left: 0; width: min(290px, 86vw); box-shadow: 4px 0 18px rgba(11,37,69,.18); }
  .lado[data-cerrado] { display: none; }
  .mostrar-lado { display: inline-flex; }
  .grupo > span { display: none; }
  #coord { min-width: 0; }
}
</style>

<div class="app">
  <header class="barra" id="barra">
    <div class="marca">DrenIE <small id="nombrePry">visor</small></div>
    <button class="app-btn" id="btnInicio" title="Volver a la lista de proyectos">Inicio</button>
    <button class="app-btn calc" id="btnCalcular" title="Calcula todo el diseño con lo dibujado y elegido en el visor">Calcular</button>
    <button class="app-btn" id="btnEntreg" title="Planos, metrado, memorias, especificaciones y revisión">Entregables</button>
    <button class="sol-btn" id="btnSol" hidden title="Observaciones del cálculo y soluciones propuestas">Soluciones <b id="nSol">0</b></button>
    <button class="mostrar-lado" id="btnLado" aria-label="Mostrar paneles">Paneles</button>
  </header>

  <div class="cuerpo">
    <aside class="lado" id="lado" data-cerrado>
      <div class="pestanas" role="tablist">
        <button class="on" data-hoja="hSup" role="tab">Superficies</button>
        <button data-hoja="hCapas" role="tab">Capas</button>
        <button data-hoja="hEd" role="tab">Ediciones</button>
        <button data-hoja="hSol" role="tab" id="tabSol" hidden>Soluciones</button>
      </div>
      <div class="hoja" id="hSup"></div>
      <div class="hoja" id="hCapas" hidden></div>
      <div class="hoja" id="hEd" hidden></div>
      <div class="hoja" id="hSol" hidden></div>
      <section class="props" id="props" aria-label="Propiedades"></section>
    </aside>
    <main class="lienzo" id="lienzo">
      <canvas id="capaBase"></canvas>
      <canvas id="capaSup"></canvas>
      <div class="tip" id="tip" hidden></div>
    </main>
  </div>

  <footer class="pie">
    <div class="historial" id="historial" aria-live="polite"></div>
    <div class="linea-cmd"><b id="pregunta">Comando:</b><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Línea de comando"><div class="sug" id="sug" hidden></div></div>
    <div class="estado">
      <span id="coord">X 0.000  Y 0.000</span>
      <button id="btnOsnap" class="on" title="Referencia a objetos (F3)">OSNAP</button>
      <button id="btnOrto" title="Ortogonal (F8)">ORTO</button>
      <button id="btnPolar" class="on" title="Rastreo polar cada 45° (F10)">POLAR</button>
      <button id="btnTxt" class="on" title="Textos del plano">TEXTOS</button>
      <button id="btnSup" class="on" title="Mapa de superficies">SUPERFICIES</button>
      <button id="btnAyuda" title="Lista de comandos (F1)">?</button>
      <button id="btnEnter" class="tactil" title="Enter">↵ Enter</button>
      <button id="btnEsc" class="tactil" title="Cancelar">Esc</button>
      <button id="btnU" class="tactil" title="Deshacer">Deshacer</button>
      <span id="modoSnap"></span>
    </div>
  </footer>
</div>

  cargarEscena(d.escena); montantesIniciales(); sumiderosIniciales();
  if (d.ediciones) { importar(JSON.stringify(d.ediciones)); pilaU.length = 0; }
  if (PUENTE) { ultimoGuardado = JSON.stringify(exportar()); const np = document.getElementById("nombrePry"); if (np && d.nombre) np.textContent = d.nombre; }
  refrescar();
  msg("Proyecto cargado: " + caras.length + " áreas, " + capas.length + " capas." + (RES ? " Último cálculo: " + (RES.resumen.longitud_m || 0).toFixed(1) + " m de cuneta, " +
      RES.resumen.cumple + "/" + RES.resumen.comprobaciones + " comprobaciones." : " Todavía sin calcular: botón Calcular."));
  if (pendientes().length) mostrarSoluciones();
}
async function calcularApp() {
  try {
    clearTimeout(guardaPend);
    const r = await tarea("calcular", { ediciones: exportar() }, "Calculando el diseño, los planos y los documentos");
    await cargarApp();
    const rs = r.resumen || {}, rv = r.revision || {};
    msg("Cálculo listo en " + Math.round(r.segundos || 0) + " s: " + rs.ejes + " ejes, " + (rs.longitud_m || 0).toFixed(1) + " m, " + rs.descargas + " descargas, " +
        rs.cumple + "/" + rs.comprobaciones + " comprobaciones; revisión " + (rv.comprobaciones - rv.no_cumple) + "/" + rv.comprobaciones +
        (rs.observaciones_pendientes ? "; " + rs.observaciones_pendientes + " observaciones por decidir." : "."));
  } catch (er) { msg("No se pudo calcular: " + er.message); alertaVen("No se pudo calcular", er.message); }
}
function alertaVen(titulo, texto) {
  let a = document.getElementById("ventanaSol"); if (a) a.remove();
  a = document.createElement("div"); a.className = "ayuda"; a.id = "ventanaSol"; a.setAttribute("role", "dialog");
  a.innerHTML = '<div class="fila" style="justify-content:space-between;margin-top:0"><b>' + htm(titulo) + '</b><button type="button" id="cerrarSol">Cerrar</button></div><p>' + htm(texto) + "</p>";
  lienzo.appendChild(a); document.getElementById("cerrarSol").onclick = () => a.remove();
}
async function mostrarEntregables() {
  let a = document.getElementById("ventanaSol"); if (a) a.remove();
  try {
    const e = await api("entregables");
    a = document.createElement("div"); a.className = "ayuda"; a.id = "ventanaSol"; a.setAttribute("role", "dialog");
    a.innerHTML = '<div class="fila" style="justify-content:space-between;margin-top:0"><b>Entregables del último cálculo</b><span class="fila" style="margin:0"><button type="button" id="abrCarp">Abrir la carpeta</button><button type="button" id="cerrarSol">Cerrar</button></span></div>' +
      (e.archivos.length ? '<table class="entreg">' + e.archivos.map((f, k) => "<tr><td>" + htm(f) + '</td><td><button type="button" data-f="' + k + '">Abrir</button></td></tr>').join("") + "</table>" : '<p class="nota">Todavía no hay entregables: use Calcular.</p>') +
      '<p class="nota">Carpeta: ' + htm(e.carpeta) + "</p>";
    lienzo.appendChild(a); document.getElementById("cerrarSol").onclick = () => a.remove();
    document.getElementById("abrCarp").onclick = () => api("abrir_archivo", {}).catch(er => msg(er.message));
    a.querySelectorAll("[data-f]").forEach(b => b.onclick = () => api("abrir_archivo", { nombre: e.archivos[+b.dataset.f] }).then(() => msg("Abriendo " + e.archivos[+b.dataset.f]), er => msg(er.message)));
  } catch (er) { msg(er.message); }
}
if (PUENTE) document.body.classList.add("modo-drenie");
else if (APP) {
  document.body.classList.add("modo-app");
  document.getElementById("btnInicio").onclick = () => { location.href = "/"; };
  document.getElementById("btnCalcular").onclick = calcularApp;
  document.getElementById("btnEntreg").onclick = mostrarEntregables;
}

/* ====================================================================================== arranque */
(function () {
  let d = null; try { d = JSON.parse(document.getElementById("escena-datos").textContent); } catch (e) {}
  dimensionar();
  if (APP) { dimensionar(); cargarApp().catch(er => { msg("No se pudo abrir el proyecto: " + er.message); alertaVen("No se pudo abrir el proyecto", er.message); }); return; }
  try { RES = JSON.parse(document.getElementById("resultado-datos").textContent); } catch (e) { RES = null; }
  if (d) { cargarEscena(d); recuperar(); ED.soluciones = ED.soluciones || {}; montantesIniciales(); sumiderosIniciales(); refrescar(); msg("Escena cargada: " + caras.length + " áreas, " + capas.length + " capas. F1: lista de comandos.");
    if (pendientes().length) { msg("El cálculo dejó " + pendientes().length + " observaciones con soluciones propuestas: botón Soluciones."); mostrarSoluciones(); } }
  else {
    msg("Abra la escena del proyecto (escena.json que genera el motor de DrenIE).");
    const i = document.createElement("input"); i.type = "file"; i.accept = ".json"; i.id = "abrirEscena";
    i.onchange = () => { const r = new FileReader(); r.onload = () => { cargarEscena(JSON.parse(r.result)); recuperar(); montantesIniciales(); sumiderosIniciales(); refrescar(); }; r.readAsText(i.files[0]); };
    document.querySelector(".linea-cmd").appendChild(i);
  }
})();
</script>
