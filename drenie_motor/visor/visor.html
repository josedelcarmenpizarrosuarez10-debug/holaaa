<title>Visor DrenIE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Espacio modelo de CAD a pantalla completa: cinta de iconos arriba, paneles y propiedades a la izquierda,
   linea de comando y barra de estado abajo. Un solo aspecto oscuro, como el espacio modelo de AutoCAD. */
:root {
  --bg: #1f252c;          /* espacio modelo */
  --panel: #272e37;       /* barras y paneles */
  --panel-2: #303945;
  --line: #3d4856;
  --fg: #dfe5ec;
  --muted: #95a2b1;
  --accent: #e9b949;      /* OSNAP, comando activo, medidas */
  --sel: #4f9dff;         /* seleccion y pinzamientos */
  --cota: #7fd6ff;        /* cotas */
  --warn: #ff4fd8;        /* areas sin asignar */
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.35 var(--font-ui); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marca { font-weight: 600; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; margin-right: 4px; }
.marca small { color: var(--muted); font-weight: 400; }
.grupo { display: flex; align-items: center; gap: 2px; padding-right: 8px; border-right: 1px solid var(--line); }
.grupo:last-child { border-right: 0; }
.grupo > span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; margin-right: 4px; }
button { font: 500 12px var(--font-ui); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 8px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.ico { width: 30px; height: 28px; padding: 0; justify-content: center; background: transparent; border-color: transparent; }
button.ico:hover { background: var(--panel-2); border-color: var(--line); }
button.ico svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
button.on { border-color: var(--accent); color: var(--accent); }
button.activo { background: var(--accent); color: #1b1f24; border-color: var(--accent); }
.cuerpo { display: grid; grid-template-columns: 272px 1fr; min-height: 0; }
.lado { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pestanas { display: flex; border-bottom: 1px solid var(--line); }
.pestanas button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; justify-content: center; color: var(--muted); }
.pestanas button.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.hoja { overflow: auto; padding: 10px 12px; flex: 1; min-height: 0; }
.props { border-top: 1px solid var(--line); padding: 10px 12px; max-height: 46%; overflow: auto; background: var(--panel); flex: none; }
.capa { display: grid; grid-template-columns: 16px 10px 1fr auto; gap: 7px; align-items: center; padding: 2px 0; font-size: 12px; }
.capa i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.capa label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.capa small { color: var(--muted); font: 11px var(--font-mono); }
.tabla { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tabla td, .tabla th { padding: 4px 2px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; vertical-align: top; }
.tabla td.n, .tabla th.n { text-align: right; font-family: var(--font-mono); }
.tabla th { color: var(--muted); font-weight: 500; }
.tabla i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ficha td:first-child { color: var(--muted); width: 42%; }
.ficha td:last-child { font-family: var(--font-mono); word-break: break-word; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
h3:first-child { margin-top: 0; }
.nota { color: var(--muted); font-size: 12px; margin: 6px 0; }
.lista-sin button { width: 100%; justify-content: space-between; margin-bottom: 4px; }
.fila { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
select, .filtro { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 12px var(--font-ui); padding: 4px 6px; }
textarea { width: 100%; min-height: 110px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 11px var(--font-mono); padding: 6px; }
.lienzo { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
.lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#capaSup { cursor: none; }
.tip { position: absolute; z-index: 4; pointer-events: none; background: rgba(32, 38, 46, .94); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 7px; font: 11px/1.4 var(--font-mono); color: var(--fg); white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.tip b { color: var(--accent); font-weight: 500; }
.tip small { display: block; color: var(--muted); font-size: 10px; }
.paleta { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; width: 300px; max-width: calc(100% - 20px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.paleta p { grid-column: 1 / -1; margin: 0 0 4px; color: var(--muted); font-size: 12px; }
.paleta button { justify-content: flex-start; }
.paleta button i, .muestra { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
.paleta kbd { margin-left: auto; font: 11px var(--font-mono); color: var(--muted); }
.ayuda { position: absolute; z-index: 7; inset: 12px; max-width: 640px; margin: auto; height: fit-content; max-height: calc(100% - 24px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
.ayuda table { width: 100%; border-collapse: collapse; }
.ayuda td { padding: 3px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
.ayuda td:first-child { font-family: var(--font-mono); color: var(--accent); white-space: nowrap; }
.pie { background: var(--panel); border-top: 1px solid var(--line); position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.historial { font: 12px var(--font-mono); color: var(--muted); height: 36px; overflow: auto; padding-top: 3px; white-space: pre-wrap; }
.linea-cmd { display: flex; align-items: center; gap: 8px; padding: 3px 0; position: relative; }
.linea-cmd b { font: 500 12px var(--font-mono); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
.linea-cmd input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 13px var(--font-mono); padding: 4px 8px; }
.sug { position: absolute; bottom: 100%; right: 0; z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 240px; padding: 3px; }
.sug div { padding: 3px 8px; font: 12px var(--font-mono); cursor: pointer; display: flex; gap: 10px; }
.sug div span { color: var(--muted); font-family: var(--font-ui); }
.sug div.on, .sug div:hover { background: var(--panel-2); }
.estado { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font: 11px var(--font-mono); color: var(--muted); padding: 2px 0 6px; font-variant-numeric: tabular-nums; }
.estado button { padding: 2px 6px; font: 11px var(--font-mono); }
#coord { min-width: 250px; }
.mostrar-lado { display: none; }
@media (max-width: 760px) {
  .cuerpo { grid-template-columns: 1fr; position: relative; }
  .lado { position: absolute; z-index: 6; top: 0; bottom: 0; left: 0; width: min(290px, 86vw); box-shadow: 4px 0 18px rgba(0,0,0,.4); }
  .lado[data-cerrado] { display: none; }
  .mostrar-lado { display: inline-flex; }
  .grupo > span { display: none; }
  #coord { min-width: 0; }
}
</style>

<div class="app">
  <header class="barra" id="barra">
    <div class="marca">DrenIE <small id="nombrePry">visor</small></div>
    <button class="mostrar-lado" id="btnLado" aria-label="Mostrar paneles">Paneles</button>
  </header>

  <div class="cuerpo">
    <aside class="lado" id="lado" data-cerrado>
      <div class="pestanas" role="tablist">
        <button class="on" data-hoja="hSup" role="tab">Superficies</button>
        <button data-hoja="hCapas" role="tab">Capas</button>
        <button data-hoja="hEd" role="tab">Ediciones</button>
      </div>
      <div class="hoja" id="hSup"></div>
      <div class="hoja" id="hCapas" hidden></div>
      <div class="hoja" id="hEd" hidden></div>
      <section class="props" id="props" aria-label="Propiedades"></section>
    </aside>
    <main class="lienzo" id="lienzo">
      <canvas id="capaBase"></canvas>
      <canvas id="capaSup"></canvas>
      <div class="tip" id="tip" hidden></div>
    </main>
  </div>

  <footer class="pie">
    <div class="historial" id="historial" aria-live="polite"></div>
    <div class="linea-cmd"><b id="pregunta">Comando:</b><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Línea de comando"><div class="sug" id="sug" hidden></div></div>
    <div class="estado">
      <span id="coord">X 0.000  Y 0.000</span>
      <button id="btnOsnap" class="on" title="Referencia a objetos (F3)">OSNAP</button>
      <button id="btnOrto" title="Ortogonal (F8)">ORTO</button>
      <button id="btnPolar" class="on" title="Rastreo polar cada 45° (F10)">POLAR</button>
      <button id="btnTxt" class="on" title="Textos del plano">TEXTOS</button>
      <button id="btnSup" class="on" title="Mapa de superficies">SUPERFICIES</button>
      <button id="btnAyuda" title="Lista de comandos (F1)">?</button>
      <span id="modoSnap"></span>
    </div>
  </footer>
</div>

<script id="escena-datos" type="application/json">null</script>
<script>
"use strict";
/* ====================================================================================== datos fijos */
const TIPOS = {
  techo: ["Techo", "#9aa3ad"], vereda: ["Vereda / circulación", "#d8b06a"], patio: ["Patio libre pavimentado", "#c79a55"],
  pavimento: ["Otros pisos de concreto", "#b9a98a"], estacionamiento: ["Estacionamiento", "#7f9fc4"], juegos: ["Juegos (caucho)", "#e8875a"],
  cuneta: ["Cuneta", "#5aa9e6"], verde: ["Área verde", "#6fae63"], sin_asignar: ["Sin asignar", "#ff4fd8"],
};
const ASIGNABLES = ["techo", "vereda", "patio", "pavimento", "estacionamiento", "juegos", "verde"];
const NOM_ENT = { linea: "Línea", pl: "Polilínea", cuneta: "Eje de cuneta", flecha: "Flecha de caída", descarga: "Descarga", cota: "Cota", texto: "Texto" };
// [nombre, texto, alias, grupo de la cinta, icono (trazos SVG 16x16)]
const COMANDOS = [
  ["linea", "Línea", ["L", "LINEA", "LINE"], "Dibujo", "M2 14L14 2"],
  ["pl", "Polilínea", ["PL", "POLILINEA", "PLINE"], "Dibujo", "M2 13L6 5l4 5 4-7"],
  ["rect", "Rectángulo", ["REC", "RECTANG", "RECTANGULO"], "Dibujo", "M2 4h12v8H2z"],
  ["circulo", "Círculo", ["C", "CI", "CIRCULO", "CIRCLE"], "Dibujo", "M8 2a6 6 0 1 0 .01 0M8 8h.01"],
  ["texto", "Texto", ["TX", "T", "TEXTO", "DT"], "Dibujo", "M3 3h10M8 3v10M6 13h4"],
  ["asignar", "Asignar área (sombreado)", ["H", "SB", "SOMBREADO", "ASIGNAR", "HATCH"], "Drenaje", "M2 2h12v12H2zM2 8l6-6M2 14L14 2M8 14l6-6"],
  ["flecha", "Flecha de caída de techo", ["FL", "FLECHA"], "Drenaje", "M1 7l7-5 7 5M8 5v9M5 11l3 3 3-3"],
  ["cuneta", "Eje de cuneta", ["CU", "CUNETA"], "Drenaje", "M2 4v8h12V4M5 4v5h6V4"],
  ["descarga", "Descarga (salida por el cerco)", ["DE", "DESCARGA"], "Drenaje", "M8 2v8M5 7l3 3 3-3M2 14h12"],
  ["mover", "Desplazar", ["M", "MOVER", "DESPLAZA", "MOVE"], "Modificar", "M8 1v14M1 8h14M6 3l2-2 2 2M6 13l2 2 2-2M3 6L1 8l2 2M13 6l2 2-2 2"],
  ["copiar", "Copiar", ["CO", "CP", "COPIAR", "COPY"], "Modificar", "M2 6h8v8H2zM6 2h8v8h-4"],
  ["rotar", "Girar", ["RO", "GI", "GIRA", "ROTAR", "ROTATE"], "Modificar", "M13 8a5 5 0 1 1-1.5-3.5M12 1v4H8"],
  ["escala", "Escala", ["ES", "SC", "ESCALA", "SCALE"], "Modificar", "M2 14V9M2 14h5M2 14L14 2M14 2H9M14 2v5"],
  ["simetria", "Simetría", ["SI", "MI", "SIMETRIA", "MIRROR"], "Modificar", "M8 1v14M6 4L2 8l4 4zM10 4l4 4-4 4z"],
  ["desfase", "Desfase (equidistancia)", ["O", "EQ", "DESFASE", "EQUIDIST", "OFFSET"], "Modificar", "M2 10L7 4h7M2 14l5-6h7"],
  ["estirar", "Estirar vértice (pinzamiento)", ["EST", "ESTIRAR", "STRETCH"], "Modificar", "M2 14l5-5h7M7 9l4-6M10 2h2v2"],
  ["descomponer", "Descomponer", ["X", "DESCOMP", "DESCOMPONER", "EXPLODE"], "Modificar", "M3 13l4-4M9 7l4-4M3 3l3 3M10 10l3 3"],
  ["borrar", "Borrar", ["E", "B", "BORRA", "BORRAR", "ERASE"], "Modificar", "M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10"],
  ["cotaal", "Cota alineada", ["DAL", "DIM", "COTA", "ACOTAR", "DIMALINEADA", "DIMALIGNED"], "Medir", "M3 13L13 3M1 11l4 4M11 1l4 4M6 6l1.5 1.5"],
  ["cotalin", "Cota lineal", ["DLI", "DIMLINEAL", "DIMLINEAR"], "Medir", "M2 4v9M14 4v9M2 8h12M4 6.5L2 8l2 1.5M12 6.5L14 8l-2 1.5"],
  ["dist", "Distancia", ["DI", "DIST", "DISTANCIA"], "Medir", "M1 11L11 1l4 4L5 15zM4 8l1.5 1.5M6 6l1.5 1.5M8 4l1.5 1.5"],
  ["area", "Área (puntos u objeto)", ["AA", "AREA"], "Medir", "M3 13L2 5l6-3 6 4-2 7z"],
  ["id", "Coordenada de un punto", ["ID"], "Medir", "M8 1v14M1 8h14M5.5 5.5h5v5h-5z"],
  ["zoom", "Zoom ventana", ["Z", "ZOOM"], "Vista", "M7 2a5 5 0 1 0 .01 0M11 11l4 4M5 7h4M7 5v4"],
  ["extension", "Zoom extensión", ["ZE"], "Vista", "M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"],
  ["previo", "Zoom previo", ["ZP"], "Vista", "M7 2a5 5 0 1 0 .01 0M11 11l4 4M5 7h4"],
  ["pan", "Encuadre (mano)", ["P", "ENCUADRE", "PAN"], "Vista", "M8 1v14M1 8h14M6 3l2-2 2 2M6 13l2 2 2-2M3 6L1 8l2 2M13 6l2 2-2 2"],
  ["deshacer", "Deshacer (Ctrl+Z)", ["U", "H-", "DESHACER", "UNDO"], "Vista", "M5 3L2 6l3 3M2 6h7a4 4 0 0 1 0 8H6"],
  ["rehacer", "Rehacer (Ctrl+Y)", ["RE", "REHACER", "REDO"], "Vista", "M11 3l3 3-3 3M14 6H7a4 4 0 0 0 0 8h3"],
  ["propiedades", "Propiedades", ["PR", "PROPIEDADES", "LI", "LIST"], null, null],
  ["osnap", "OSNAP sí / no", ["OS", "REFENT"], null, null],
  ["ayuda", "Lista de comandos", ["AYUDA", "?"], null, null],
];
const ALIAS = {}, TXT_CMD = {};
for (const [n, t, al] of COMANDOS) { TXT_CMD[n] = t; ALIAS[n.toUpperCase()] = n; for (const a of al) ALIAS[a] = n; }
const CON_SELECCION = ["mover", "copiar", "rotar", "escala", "simetria", "descomponer", "borrar"];

/* ====================================================================================== escena */
let E = null, ORX = 0, ORY = 0;
const capas = [], porNombre = new Map();   // {nombre, visible, grupos:[{color, path}], n, color}
const caras = [];                          // {id, tipo, nombre, fuente, area, p, anillos, bb, path, per}
let cerco = [], ejes = [];
const segs = { a: [], c: [] };             // segmentos del plano para OSNAP y seleccion; c = capa (-1 cerco, -2 cunetas)
let rejilla = new Map(); const CELDA = 4;

function decod(arr) {
  const out = new Float64Array(arr.length); let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) {
    if (i === 0) { x = arr[0]; y = arr[1]; } else { x += arr[i]; y += arr[i + 1]; }
    out[i] = x / 100; out[i + 1] = y / 100;
  }
  return out;
}
function cargarEscena(esc) {
  E = esc; ORX = esc.origen[0]; ORY = esc.origen[1];
  document.getElementById("nombrePry").textContent = (esc.proyecto && (esc.proyecto.nombre_corto || esc.proyecto.nombre)) || "proyecto";
  capas.length = 0; caras.length = 0; segs.a = []; segs.c = []; porNombre.clear();
  esc.capas.forEach((c, k) => {
    const grupos = [];
    for (const g of c.grupos) {
      const path = new Path2D();
      g.p.forEach((pp, j) => {
        const v = decod(pp); path.moveTo(v[0], v[1]);
        for (let i = 2; i < v.length; i += 2) path.lineTo(v[i], v[i + 1]);
        if (g.c[j]) path.closePath();
        agregarSegs(v, g.c[j], k);
      });
      grupos.push({ color: g.color, path });
    }
    const capa = { nombre: c.nombre, visible: !/^(ARBOLES|equipamiento|INODOROS|AS AMOBLADOS)/i.test(c.nombre), grupos, n: c.n, color: grupos[0] ? grupos[0].color : "#888" };
    capas.push(capa); porNombre.set(c.nombre, capa);
  });
  for (const t of esc.textos || []) if (!porNombre.has(t.c)) { const capa = { nombre: t.c, visible: true, grupos: [], n: 0, color: "#c8d0d9", soloTexto: true }; capas.push(capa); porNombre.set(t.c, capa); }
  for (const f of esc.caras) {
    const anillos = [], path = new Path2D(); let bb = [1e18, 1e18, -1e18, -1e18], per = 0;
    for (const pol of f.a) for (const an of pol) {
      const v = decod(an); anillos.push(v); path.moveTo(v[0], v[1]);
      for (let i = 2; i < v.length; i += 2) { path.lineTo(v[i], v[i + 1]); per += Math.hypot(v[i] - v[i - 2], v[i + 1] - v[i - 1]); }
      path.closePath();
      for (let i = 0; i < v.length; i += 2) { bb[0] = Math.min(bb[0], v[i]); bb[1] = Math.min(bb[1], v[i + 1]); bb[2] = Math.max(bb[2], v[i]); bb[3] = Math.max(bb[3], v[i + 1]); }
    }
    caras.push({ id: f.id, tipo: f.tipo, nombre: f.nombre, fuente: f.fuente, area: f.area, p: f.p, anillos, bb, path, per });
  }
  cerco = decod(esc.cerco); agregarSegs(cerco, true, -1);
  ejes = esc.ejes.map(decod); ejes.forEach(v => agregarSegs(v, false, -2));
  armarRejilla(); verExtension(); pintarCapas(); refrescar();
}
function agregarSegs(v, cerrada, capa) {
  const n = v.length / 2;
  for (let i = 0; i < n - 1; i++) { segs.a.push(v[2 * i], v[2 * i + 1], v[2 * i + 2], v[2 * i + 3]); segs.c.push(capa); }
  if (cerrada && n > 2) { segs.a.push(v[2 * n - 2], v[2 * n - 1], v[0], v[1]); segs.c.push(capa); }
}
const claveCelda = (i, j) => i * 100003 + j;
function armarRejilla() {
  rejilla = new Map(); const a = segs.a;
  for (let k = 0; k < a.length; k += 4) {
    const i0 = Math.floor(Math.min(a[k], a[k + 2]) / CELDA), i1 = Math.floor(Math.max(a[k], a[k + 2]) / CELDA);
    const j0 = Math.floor(Math.min(a[k + 1], a[k + 3]) / CELDA), j1 = Math.floor(Math.max(a[k + 1], a[k + 3]) / CELDA);
    if ((i1 - i0 + 1) * (j1 - j0 + 1) > 400) continue;
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) { const c = claveCelda(i, j); let l = rejilla.get(c); if (!l) rejilla.set(c, l = []); l.push(k); }

    h += '<p class="nota">Use Desplazar, Copiar, Girar, Borrar… sobre lo seleccionado. Esc: quitar selección.</p>';
  } else if (cs_.length) {

    let r = "";
    if (cs_.length === 1) { const c = cs_[0], t = tipoCara(c); r = fila("Área N.°", c.id) + fila("Tipo", TIPOS[t][0]) + fila("Superficie", "<b>" + c.area.toFixed(2) + " m²</b>") + fila("Perímetro", c.per.toFixed(2) + " m") + fila("C", E.C[t] != null ? E.C[t].toFixed(2) : "–") + fila("Origen", t !== c.tipo ? "asignada en el visor" : c.fuente); }

    h += '<table class="tabla ficha">' + r + '</table><p class="nota">' + (cs_.length > 1 ? "Asignar todas como" : "Cambiar tipo") + "</p>" + selectorTipo(tipos.length === 1 && ASIGNABLES.includes(tipos[0]) ? tipos[0] : "", "selTipoCara");
  } else if (SEL.seg >= 0) {
    const a = segs.a, k = SEL.seg, p = [a[k], a[k + 1]], q = [a[k + 2], a[k + 3]], ci = segs.c[k / 4];
    h += '<table class="tabla ficha">' + fila("Objeto", "Línea del plano") + fila("Capa", nombreCapa(ci)) + fila("Longitud", dist(p, q).toFixed(3) + " m") + fila("Ángulo", angulo(p, q).toFixed(2) + "°") + fila("Desde", U(p)) + fila("Hasta", U(q)) + "</table>";
    if (ci >= 0) h += '<div class="fila"><button type="button" id="btnApagarCapa">Apagar esta capa</button></div>';

  } else if (MED) {

    if (MED.k === "area") h += '<table class="tabla ficha">' + fila("Área", "<b>" + (MED.cara ? MED.cara.area : Math.abs(areaPol(MED.pts))).toFixed(2) + " m²</b>") + fila("Perímetro", (MED.cara ? MED.cara.per : perimetro(MED.pts, true)).toFixed(2) + " m") + "</table>";
    if (MED.k === "punto") h += '<table class="tabla ficha">' + fila("X", (MED.p[0] + ORX).toFixed(3)) + fila("Y", (MED.p[1] + ORY).toFixed(3)) + "</table>";
  } else h += '<p class="nota">Clic en un objeto, una línea o un área para ver sus datos. Arrastre para seleccionar varias áreas y asignarlas juntas.</p>';
  el.innerHTML = h;
  const s1 = document.getElementById("selTipoPol"); if (s1) s1.onchange = () => { guardarPaso(); ents[0].tipo = s1.value; msg("Polígono → " + TIPOS[s1.value][0] + "."); refrescar(); };

}
function importar(texto) {
  let d; try { d = JSON.parse(texto); } catch (e) { return msg("El texto pegado no es un JSON válido."); }

  for (const s of d.superficies || []) nuevaEnt("pl", s.poligono.map(L), { cerr: true, tipo: s.tipo, nombre: s.nombre });
  for (const f of d.flechas_techo || []) nuevaEnt("flecha", [L(f.desde), L(f.hacia)]);
  for (const l of d.ejes_lineas || []) nuevaEnt("cuneta", l.map(L));
  for (const q of d.descargas || []) nuevaEnt("descarga", [L([q.x, q.y])]);
  for (const c of d.cotas || []) nuevaEnt("cota", c.puntos.map(L), { modo: c.modo });
  for (const t of d.textos || []) nuevaEnt("texto", [L([t.x, t.y])], { t: t.texto, h: t.altura });

}

/* ====================================================================================== raton, tacto y teclado */
let arrastre = null; const toques = new Map();
cs.addEventListener("pointerdown", ev => {
  cs.setPointerCapture(ev.pointerId); toques.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (toques.size === 2) { arrastre = { tipo: "pellizco" }; caja = null; return; }
  arrastre = { x: ev.offsetX, y: ev.offsetY, cx: V.cx, cy: V.cy, boton: ev.button, tactil: ev.pointerType === "touch", mov: false };
  if (ev.button === 0 && !C) { const pz = pinzaEn(ev.offsetX, ev.offsetY); if (pz) { arrastre.pinza = pz; } }
});
const seleccionando = () => !C || (CON_SELECCION.includes(C.nombre) && !C.listo) || C.nombre === "estirar";
cs.addEventListener("pointermove", ev => {
  raton = [ev.offsetX, ev.offsetY];
  if (toques.has(ev.pointerId)) toques.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (arrastre && arrastre.tipo === "pellizco" && toques.size === 2) {
    const [a, b] = [...toques.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (arrastre.d) { const w = aMundo(m[0], m[1]); V.s *= d / arrastre.d; const w2 = aMundo(m[0], m[1]); V.cx += w[0] - w2[0]; V.cy += w[1] - w2[1];
      if (arrastre.m) { V.cx -= (m[0] - arrastre.m[0]) / V.s; V.cy += (m[1] - arrastre.m[1]) / V.s; } dibujarBase(); }

    if (panear) { V.cx = arrastre.cx - (ev.offsetX - arrastre.x) / V.s; V.cy = arrastre.cy + (ev.offsetY - arrastre.y) / V.s; dibujarBase(); }
    else if (arrastre.boton === 0) caja = [[arrastre.x, arrastre.y], [ev.offsetX, ev.offsetY]];
  }
  if (arrastre && arrastre.pinza && arrastre.mov && !C) { const pz = arrastre.pinza; C = { nombre: "pinza", ent: pz.id, idx: pz.i, base: pz.p, pts: [pz.p] }; pedirPaso(); }

  snap = puntos && !caja ? buscarSnap(cursor[0], cursor[1], u, C && C.nombre === "pinza" ? [C.ent] : null) : null;

  }

});
cs.addEventListener("pointerup", ev => {
  toques.delete(ev.pointerId);

  if (caja) { const k = caja; caja = null; aplicarCaja(k[0], k[1]); return; }
  if (ev.button === 2) { ev.preventDefault(); return enter(); }
  if (C && C.nombre === "pinza" && a.pinza) { if (a.mov) punto(puntoActual()); return; }
  if (a.mov || ev.button === 1) return;
  if (!C && a.pinza) { C = { nombre: "pinza", ent: a.pinza.id, idx: a.pinza.i, base: a.pinza.p, pts: [a.pinza.p] }; pedirPaso(); return dibujarSup(); }
  if (C && C.nombre === "tipoPol") return;
  if (C && C.nombre === "estirar") { const pz = pinzaEn(ev.offsetX, ev.offsetY); if (pz) { C = { nombre: "pinza", ent: pz.id, idx: pz.i, base: pz.p, pts: [pz.p] }; pedirPaso(); return; } }
  if (C) return punto(puntoActual());

cs.addEventListener("contextmenu", ev => ev.preventDefault());
cs.addEventListener("pointerleave", () => { raton = [-100, -100]; hoverCara = hoverEnt = null; tip.hidden = true; dibujarSup(); });
cs.addEventListener("wheel", ev => {
  ev.preventDefault(); const w = aMundo(ev.offsetX, ev.offsetY), f = Math.exp(-ev.deltaY * 0.0015);
  V.s = Math.max(0.05, Math.min(5000, V.s * f)); const w2 = aMundo(ev.offsetX, ev.offsetY); V.cx += w[0] - w2[0]; V.cy += w[1] - w2[1];
  redibujar();
}, { passive: false });
cs.addEventListener("auxclick", ev => { if (ev.button === 1 && ev.detail === 2) { guardarVista(); verExtension(); redibujar(); } });

function interpretar(txt) {
  const t = txt.trim().replace(/\s+/g, ""); if (!t) return null;
  const u = ultimoPunto(); let m;
  if ((m = t.match(/^@(-?[\d.]+)<(-?[\d.]+)$/)) && u) { const d = +m[1], a = +m[2] * Math.PI / 180; return [u[0] + d * Math.cos(a), u[1] + d * Math.sin(a)]; }
  if ((m = t.match(/^@(-?[\d.]+),(-?[\d.]+)$/)) && u) return [u[0] + +m[1], u[1] + +m[2]];
  if ((m = t.match(/^(-?[\d.]+),(-?[\d.]+)$/))) { let x = +m[1], y = +m[2]; if (Math.abs(x) > 10000) { x -= ORX; y -= ORY; } return [x, y]; }
  if ((m = t.match(/^-?[\d.]+$/)) && u && cursor) { const q = aplicarOrto(cursor), dx = q[0] - u[0], dy = q[1] - u[1], L = Math.hypot(dx, dy) || 1, d = +t; return [u[0] + dx / L * d, u[1] + dy / L * d]; }
  return null;
}
function procesar(v) {
  ocultarSug();
  if (!v) return enter();
  if (paleta && /^[1-7]$/.test(v)) { const el = paleta._elegir; ocultarPaleta(); return el(ASIGNABLES[+v - 1]); }
  if (C) {
    const n = C.nombre;
    if (n === "texto" && C.espera === "texto") { guardarPaso(); const e = nuevaEnt("texto", [C.pts[0]], { t: v, h: alturaTexto }); msg("Texto colocado."); cancelar(true); refrescar(); return seleccionarSolo(e); }
    if (n === "texto" && C.espera === "altura") { const h = +v; if (h > 0) alturaTexto = h; C.espera = null; return pedirPaso(); }
    if (n === "texto" && /^a$/i.test(v)) { C.espera = "altura"; return pedir("TEXTO  Altura en metros <" + alturaTexto.toFixed(2) + ">:"); }
    if (/^c$/i.test(v) && (n === "pl" || n === "area")) return cerrar();
    if (n === "area" && /^o$/i.test(v) && !C.pts.length) { C.objeto = true; return pedir("ÁREA  Clic dentro de un área o de un polígono dibujado:"); }
    if (n === "zoom" && /^e$/i.test(v)) { cancelar(true); return iniciar("ZE"); }
    if (n === "zoom" && /^p$/i.test(v)) { cancelar(true); return iniciar("ZP"); }
    if (/^-?[\d.]+$/.test(v) && numero(+v)) return;
    if (n !== "tipoPol") { const p = interpretar(v); if (p) return punto(p); }
    if (!ALIAS[v.toUpperCase()]) return msg("Entrada no válida: escriba un punto (x,y  @dx,dy  @dist<ángulo), un valor o Esc.");
  }
  iniciar(v);
}
/* sugerencias de la linea de comando */
const sug = document.getElementById("sug"); let sugIdx = 0, sugLista = [];
function mostrarSug() {
  const v = entrada.value.trim().toUpperCase();
  if (!v || C) return ocultarSug();
  const vistos = new Set(); sugLista = [];
  for (const [n, t, al] of COMANDOS) { const a = al.find(x => x.startsWith(v)) || (t.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").startsWith(v) ? al[0] : null); if (a && !vistos.has(n)) { vistos.add(n); sugLista.push([a, t]); } }
  if (!sugLista.length) return ocultarSug();
  sugIdx = Math.min(sugIdx, sugLista.length - 1);
  sug.innerHTML = sugLista.slice(0, 8).map(([a, t], i) => '<div data-i="' + i + '"' + (i === sugIdx ? ' class="on"' : "") + ">" + a + "<span>" + t + "</span></div>").join("");
  sug.hidden = false; sug.querySelectorAll("div").forEach(d => d.onmousedown = e => { e.preventDefault(); entrada.value = ""; ocultarSug(); procesar(sugLista[+d.dataset.i][0]); });
}
function ocultarSug() { sug.hidden = true; sugIdx = 0; }
entrada.addEventListener("input", () => { sugIdx = 0; mostrarSug(); });
entrada.addEventListener("keydown", ev => {
  if (!sug.hidden && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) { ev.preventDefault(); sugIdx = (sugIdx + (ev.key === "ArrowDown" ? 1 : -1) + Math.min(8, sugLista.length)) % Math.min(8, sugLista.length); return mostrarSug(); }
  if (!sug.hidden && ev.key === "Tab") { ev.preventDefault(); entrada.value = sugLista[sugIdx][0]; return ocultarSug(); }
  const espacioTerminaTexto = !(C && C.espera === "texto");
  if (ev.key === "Enter" || (ev.key === " " && espacioTerminaTexto)) {
    ev.preventDefault();
    let v = entrada.value.trim();
    if (!C && !sug.hidden && sugLista.length && v && !ALIAS[v.toUpperCase()]) v = sugLista[sugIdx][0];
    entrada.value = ""; procesar(v);
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") {

  }
  if (ev.key === "F1") { ev.preventDefault(); return mostrarAyuda(); }
  if (ev.key === "F3") { ev.preventDefault(); osnapOn = !osnapOn; estadoBotones(); return msg("<OSNAP " + (osnapOn ? "activado" : "desactivado") + ">"); }
  if (ev.key === "F8") { ev.preventDefault(); ortoOn = !ortoOn; if (ortoOn) polarOn = false; estadoBotones(); return msg("<ORTO " + (ortoOn ? "activado" : "desactivado") + ">"); }
  if (ev.key === "F10") { ev.preventDefault(); polarOn = !polarOn; if (polarOn) ortoOn = false; estadoBotones(); return msg("<POLAR " + (polarOn ? "activado" : "desactivado") + ">"); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); return deshacer(); }

  if (!enCampo && document.activeElement !== entrada && document.activeElement.tagName !== "BUTTON" && !ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.key.length === 1 || ev.key === "Enter")) {

function estadoBotones() {

(function () {
