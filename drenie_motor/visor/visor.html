<title>Visor DrenIE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Espacio modelo de CAD a pantalla completa: barra de ordenes arriba, capas y superficies a la izquierda,
   linea de comando y barra de estado abajo. Un solo aspecto oscuro, como el espacio modelo de AutoCAD. */
:root {
  --bg: #1f252c;          /* espacio modelo */
  --panel: #272e37;       /* barras y paneles */
  --panel-2: #303945;
  --line: #3d4856;
  --fg: #dfe5ec;
  --muted: #95a2b1;
  --accent: #e9b949;      /* marcas de OSNAP y comando activo */
  --ok: #6cc28a;
  --warn: #ff4fd8;        /* areas sin asignar */
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.35 var(--font-ui); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marca { font-weight: 600; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; }
.marca small { color: var(--muted); font-weight: 400; }
.grupo { display: flex; align-items: center; gap: 4px; }
.grupo > span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
button { font: 500 12px var(--font-ui); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 8px; cursor: pointer; display: inline-flex; gap: 5px; align-items: baseline; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button kbd { font: 11px var(--font-mono); color: var(--muted); }
button.on { border-color: var(--accent); color: var(--accent); }
button.activo { background: var(--accent); color: #1b1f24; border-color: var(--accent); }
button.activo kbd { color: #3a3220; }
.cuerpo { display: grid; grid-template-columns: 270px 1fr; min-height: 0; }
.lado { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pestanas { display: flex; border-bottom: 1px solid var(--line); }
.pestanas button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; justify-content: center; color: var(--muted); }
.pestanas button.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.hoja { overflow: auto; padding: 10px 12px; flex: 1; min-height: 0; }
.capa { display: grid; grid-template-columns: 16px 10px 1fr auto; gap: 7px; align-items: center; padding: 2px 0; font-size: 12px; }
.capa i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.capa label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.capa small { color: var(--muted); font: 11px var(--font-mono); }
.tabla { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tabla td, .tabla th { padding: 4px 2px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; }
.tabla td.n, .tabla th.n { text-align: right; font-family: var(--font-mono); }
.tabla i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
h3:first-child { margin-top: 0; }
.nota { color: var(--muted); font-size: 12px; }
.lista-sin button { width: 100%; justify-content: space-between; margin-bottom: 4px; }
textarea { width: 100%; min-height: 110px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 11px var(--font-mono); padding: 6px; }
.lienzo { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
.lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#capaSup { cursor: none; }
.paleta { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; width: 300px; max-width: calc(100% - 20px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.paleta p { grid-column: 1 / -1; margin: 0 0 4px; color: var(--muted); font-size: 12px; }
.paleta button { justify-content: flex-start; }
.paleta button i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; align-self: center; }
.pie { background: var(--panel); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.historial { font: 12px var(--font-mono); color: var(--muted); max-height: 54px; overflow: auto; padding-top: 4px; white-space: pre-wrap; }
.linea-cmd { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.linea-cmd b { font: 500 12px var(--font-mono); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.linea-cmd input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 13px var(--font-mono); padding: 5px 8px; }
.estado { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font: 11px var(--font-mono); color: var(--muted); padding: 2px 0 6px; font-variant-numeric: tabular-nums; }
.estado button { padding: 2px 6px; font: 11px var(--font-mono); }
.mostrar-lado { display: none; }
@media (max-width: 760px) {
  .cuerpo { grid-template-columns: 1fr; }
  .lado { position: absolute; z-index: 6; top: 0; bottom: 0; left: 0; width: min(290px, 86vw); box-shadow: 4px 0 18px rgba(0,0,0,.4); }
  .lado[data-cerrado] { display: none; }
  .cuerpo { position: relative; }
  .mostrar-lado { display: inline-flex; }
  .grupo > span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="barra" id="barra">
    <div class="marca">DrenIE <small id="nombrePry">visor</small></div>
    <button class="mostrar-lado" id="btnLado" aria-label="Mostrar paneles">Paneles</button>
    <div class="grupo"><span>Dibujo</span>
      <button data-cmd="L">Línea <kbd>L</kbd></button><button data-cmd="PL">Polilínea <kbd>PL</kbd></button><button data-cmd="REC">Rectángulo <kbd>REC</kbd></button>
    </div>
    <div class="grupo"><span>Drenaje</span>
      <button data-cmd="H">Asignar área <kbd>H</kbd></button><button data-cmd="FL">Flecha de caída <kbd>FL</kbd></button>
      <button data-cmd="CU">Cuneta <kbd>CU</kbd></button><button data-cmd="DE">Descarga <kbd>DE</kbd></button>
    </div>
    <div class="grupo"><span>Edición</span>
      <button data-cmd="M">Mover <kbd>M</kbd></button><button data-cmd="CO">Copiar <kbd>CO</kbd></button><button data-cmd="E">Borrar <kbd>E</kbd></button>
      <button data-cmd="U">Deshacer <kbd>U</kbd></button><button data-cmd="RE">Rehacer</button>
    </div>
    <div class="grupo"><span>Consulta</span>
      <button data-cmd="DI">Distancia <kbd>DI</kbd></button><button data-cmd="AREA">Área <kbd>AA</kbd></button><button data-cmd="ZE">Extensión <kbd>ZE</kbd></button>
    </div>
  </header>

  <div class="cuerpo">
    <aside class="lado" id="lado" data-cerrado>
      <div class="pestanas" role="tablist">
        <button class="on" data-hoja="hSup" role="tab">Superficies</button>
        <button data-hoja="hCapas" role="tab">Capas</button>
        <button data-hoja="hEd" role="tab">Ediciones</button>
      </div>
      <div class="hoja" id="hSup"></div>
      <div class="hoja" id="hCapas" hidden></div>
      <div class="hoja" id="hEd" hidden></div>

    <main class="lienzo" id="lienzo">
      <canvas id="capaBase"></canvas>
      <canvas id="capaSup"></canvas>
    </main>
  </div>

  <footer class="pie">
    <div class="historial" id="historial" aria-live="polite"></div>
    <div class="linea-cmd"><b id="pregunta">Comando:</b><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Línea de comando"></div>
    <div class="estado">
      <span id="coord">X 0.000  Y 0.000</span>
      <button id="btnOsnap" class="on" title="F3">OSNAP</button>
      <button id="btnOrto" title="F8">ORTO</button>
      <span id="modoSnap"></span>
    </div>
  </footer>
</div>

<script id="escena-datos" type="application/json">null</script>
<script>
"use strict";
/* ====================================================================================== datos */
const TIPOS = {
  techo: ["Techo", "#9aa3ad"], vereda: ["Vereda / circulación", "#d8b06a"], patio: ["Patio libre pavimentado", "#c79a55"],
  pavimento: ["Otros pisos de concreto", "#b9a98a"], estacionamiento: ["Estacionamiento", "#7f9fc4"], juegos: ["Juegos (caucho)", "#e8875a"],
  cuneta: ["Cuneta", "#5aa9e6"], verde: ["Área verde", "#6fae63"], sin_asignar: ["Sin asignar", "#ff4fd8"],
};
const ASIGNABLES = ["techo", "vereda", "patio", "pavimento", "estacionamiento", "juegos", "verde"];
let E = null;               // escena
let ORX = 0, ORY = 0;       // origen (UTM) de las coordenadas locales
const capas = [];           // {nombre, visible, grupos:[{color, path:Path2D}], n}
const caras = [];           // {id, tipo, nombre, area, anillos:[[x,y,...]], bb, path}
let cerco = [], ejes = [];
const segs = { a: [] };     // segmentos para OSNAP: [x1,y1,x2,y2,...]
let rejilla = new Map(); const CELDA = 4;

function decod(arr) {           // enteros en cm con diferencias -> [x0,y0,x1,y1,...] en m
  const out = new Float64Array(arr.length); let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) {
    if (i === 0) { x = arr[0]; y = arr[1]; } else { x += arr[i]; y += arr[i + 1]; }
    out[i] = x / 100; out[i + 1] = y / 100;
  }
  return out;
}
function cargarEscena(esc) {
  E = esc; ORX = esc.origen[0]; ORY = esc.origen[1];
  document.getElementById("nombrePry").textContent = (esc.proyecto && (esc.proyecto.nombre_corto || esc.proyecto.nombre)) || "proyecto";
  capas.length = 0; caras.length = 0; segs.a = [];
  for (const c of esc.capas) {
    const grupos = [];
    for (const g of c.grupos) {
      const path = new Path2D();
      g.p.forEach((pp, k) => {
        const v = decod(pp); path.moveTo(v[0], v[1]);
        for (let i = 2; i < v.length; i += 2) path.lineTo(v[i], v[i + 1]);
        if (g.c[k]) path.closePath();
        agregarSegs(v, g.c[k]);
      });
      grupos.push({ color: g.color, path });
    }
    capas.push({ nombre: c.nombre, visible: !/^(ARBOLES|equipamiento|INODOROS|AS AMOBLADOS)/.test(c.nombre), grupos, n: c.n });
  }
  for (const f of esc.caras) {
    const anillos = [], path = new Path2D(); let bb = [1e18, 1e18, -1e18, -1e18];
    for (const pol of f.a) for (const an of pol) {
      const v = decod(an); anillos.push(v); path.moveTo(v[0], v[1]);
      for (let i = 2; i < v.length; i += 2) path.lineTo(v[i], v[i + 1]);
      path.closePath();
      for (let i = 0; i < v.length; i += 2) { bb[0] = Math.min(bb[0], v[i]); bb[1] = Math.min(bb[1], v[i + 1]); bb[2] = Math.max(bb[2], v[i]); bb[3] = Math.max(bb[3], v[i + 1]); }
    }
    caras.push({ id: f.id, tipo: f.tipo, nombre: f.nombre, fuente: f.fuente, area: f.area, anillos, bb, path });
  }
  cerco = decod(esc.cerco); agregarSegs(cerco, true);
  ejes = esc.ejes.map(decod); ejes.forEach(v => agregarSegs(v, false));
  armarRejilla();
  verExtension(); pintarPaneles(); dibujarBase();
}
function agregarSegs(v, cerrada) {
  const n = v.length / 2;
  for (let i = 0; i < n - 1; i++) segs.a.push(v[2 * i], v[2 * i + 1], v[2 * i + 2], v[2 * i + 3]);
  if (cerrada && n > 2) segs.a.push(v[2 * n - 2], v[2 * n - 1], v[0], v[1]);
}
function claveCelda(i, j) { return i * 100003 + j; }
function armarRejilla() {
  rejilla = new Map(); const a = segs.a;
  for (let k = 0; k < a.length; k += 4) indexar(k, a[k], a[k + 1], a[k + 2], a[k + 3], rejilla);
}
function indexar(k, x1, y1, x2, y2, rj) {
  const i0 = Math.floor(Math.min(x1, x2) / CELDA), i1 = Math.floor(Math.max(x1, x2) / CELDA);
  const j0 = Math.floor(Math.min(y1, y2) / CELDA), j1 = Math.floor(Math.max(y1, y2) / CELDA);
  if ((i1 - i0 + 1) * (j1 - j0 + 1) > 400) return;          // segmentos enormes (no aportan a OSNAP)
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    const c = claveCelda(i, j); let l = rj.get(c); if (!l) rj.set(c, l = []); l.push(k);
  }
}

/* ====================================================================================== ediciones del usuario */
let ED = { ents: [], asign: [] }, sigId = 1;
const pilaU = [], pilaR = [];
function guardarPaso() { pilaU.push(JSON.stringify(ED)); if (pilaU.length > 200) pilaU.shift(); pilaR.length = 0; autoguardar(); }
function deshacer() { if (!pilaU.length) return msg("Nada que deshacer."); pilaR.push(JSON.stringify(ED)); ED = JSON.parse(pilaU.pop()); msg("Deshecho."); refrescar(); }
function rehacer() { if (!pilaR.length) return msg("Nada que rehacer."); pilaU.push(JSON.stringify(ED)); ED = JSON.parse(pilaR.pop()); msg("Rehecho."); refrescar(); }
function autoguardar() { try { localStorage.setItem("drenie-ediciones-" + (E && E.proyecto && E.proyecto.codigo || "x"), JSON.stringify(ED)); } catch (e) {} }
function recuperar() { try { const s = localStorage.getItem("drenie-ediciones-" + (E && E.proyecto && E.proyecto.codigo || "x")); if (s) { ED = JSON.parse(s); sigId = 1 + Math.max(0, ...ED.ents.map(e => e.id)); } } catch (e) {} }
function nuevaEnt(k, pts, extra) { const e = Object.assign({ id: sigId++, k, pts }, extra || {}); ED.ents.push(e); return e; }

function tipoCara(c) {           // la asignacion manual manda
  let t = c.tipo;
  for (const a of ED.asign) if (a.cara === c.id) t = a.tipo;
  return t;
}
function exportar() {
  const U = p => [+(p[0] + ORX).toFixed(3), +(p[1] + ORY).toFixed(3)];
  const out = { version: 1, fuente: "visor DrenIE", asignaciones: [], superficies: [], flechas_techo: [], ejes_lineas: [], descargas: [], lineas: [] };
  for (const a of ED.asign) { const p = U([a.x, a.y]); out.asignaciones.push({ x: p[0], y: p[1], tipo: a.tipo }); }
  let nd = 0;
  for (const e of ED.ents) {
    if (e.k === "pl" && e.cerr && e.tipo) out.superficies.push({ nombre: e.nombre || TIPOS[e.tipo][0] + " (visor)", tipo: e.tipo, poligono: e.pts.map(U) });
    else if (e.k === "flecha") out.flechas_techo.push({ desde: U(e.pts[0]), hacia: U(e.pts[1]) });
    else if (e.k === "cuneta") out.ejes_lineas.push(e.pts.map(U));
    else if (e.k === "descarga") { nd++; const p = U(e.pts[0]); out.descargas.push({ nombre: "D" + nd, x: p[0], y: p[1] }); }
    else out.lineas.push({ cerrada: !!e.cerr, puntos: e.pts.map(U) });
  }
  return out;
}

/* ====================================================================================== vista */
const lienzo = document.getElementById("lienzo"), cb = document.getElementById("capaBase"), cs = document.getElementById("capaSup");
const gb = cb.getContext("2d"), gs = cs.getContext("2d");
let V = { cx: 0, cy: 0, s: 4 }, W = 0, H = 0, DPR = 1;
let verSup = true, osnapOn = true, ortoOn = false;
function dimensionar() {
  DPR = window.devicePixelRatio || 1; const r = lienzo.getBoundingClientRect(); W = r.width; H = r.height;
  for (const c of [cb, cs]) { c.width = Math.max(1, Math.round(W * DPR)); c.height = Math.max(1, Math.round(H * DPR)); }
  dibujarBase(); dibujarSup();
}
const aPant = (x, y) => [(x - V.cx) * V.s + W / 2, H / 2 - (y - V.cy) * V.s];
const aMundo = (X, Y) => [V.cx + (X - W / 2) / V.s, V.cy - (Y - H / 2) / V.s];
function verExtension() {
  if (!cerco.length) return;
  let x0 = 1e18, y0 = 1e18, x1 = -1e18, y1 = -1e18;
  for (let i = 0; i < cerco.length; i += 2) { x0 = Math.min(x0, cerco[i]); x1 = Math.max(x1, cerco[i]); y0 = Math.min(y0, cerco[i + 1]); y1 = Math.max(y1, cerco[i + 1]); }
  V.cx = (x0 + x1) / 2; V.cy = (y0 + y1) / 2; V.s = Math.min(W / (x1 - x0 + 20), H / (y1 - y0 + 20)) || 4;
}
let patronSin = null;
function patron(g) {
  const c = document.createElement("canvas"); c.width = c.height = 10; const x = c.getContext("2d");
  x.fillStyle = "rgba(255,79,216,.22)"; x.fillRect(0, 0, 10, 10); x.strokeStyle = "rgba(255,79,216,.85)"; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(0, 10); x.lineTo(10, 0); x.stroke(); return g.createPattern(c, "repeat");
}
function aplicarT(g) { g.setTransform(DPR * V.s, 0, 0, -DPR * V.s, DPR * (W / 2 - V.cx * V.s), DPR * (H / 2 + V.cy * V.s)); }
let pendiente = false;
function dibujarBase() { if (!pendiente) { pendiente = true; requestAnimationFrame(() => { pendiente = false; _dibujarBase(); }); } }
function _dibujarBase() {
  const g = gb; g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = getComputedStyle(document.body).getPropertyValue("--bg") || "#1f252c";
  g.fillRect(0, 0, cb.width, cb.height); if (!E) return;
  aplicarT(g); const lw = 1 / V.s;
  if (verSup) {
    g.globalAlpha = .5;
    for (const c of caras) {
      const t = tipoCara(c);
      if (t === "sin_asignar") { g.globalAlpha = 1; g.fillStyle = patronSin || (patronSin = patron(g)); }
      else { g.globalAlpha = .45; g.fillStyle = TIPOS[t] ? TIPOS[t][1] : "#888"; }
      g.fill(c.path, "evenodd");
    }
    g.globalAlpha = .55;
    for (const e of ED.ents) if (e.k === "pl" && e.cerr && e.tipo) {
      const p = new Path2D(); e.pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath();
      g.fillStyle = TIPOS[e.tipo][1]; g.fill(p);
    }
    g.globalAlpha = 1;
  }
  g.lineWidth = lw;
  for (const c of capas) if (c.visible) for (const gr of c.grupos) { g.strokeStyle = gr.color; g.stroke(gr.path); }
  // cerco y cunetas del usuario
  trazar(g, cerco, true, "#c45bd0", 2.2 * lw);
  for (const v of ejes) trazar(g, v, false, "rgba(240,90,230,.75)", 3 * lw);
  // caidas de techo (azul: supuesta por el programa; naranja: del usuario)
  for (const f of (E.caidas || [])) flecha(g, f.x - f.dx * 0.6, f.y - f.dy * 0.6, f.x + f.dx * 2.2, f.y + f.dy * 2.2, f.usuario ? "#ff8a3d" : "#4f9fe8", lw);
  // textos (solo con zoom suficiente)
  g.save(); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = "#c8d0d9"; g.textBaseline = "middle";
  for (const t of (E.textos || [])) {
    const px = (t.h || .3) * V.s; if (px < 7) continue;
    const [X, Y] = aPant(t.x, t.y); if (X < -200 || Y < -50 || X > W + 50 || Y > H + 50) continue;
    g.font = Math.min(px, 22) + "px " + getComputedStyle(document.body).getPropertyValue("--font-ui"); g.fillText(t.t, X, Y);
  }
  g.restore();
  // entidades del usuario
  for (const e of ED.ents) dibujarEnt(g, e, lw, false);
}
function trazar(g, v, cerr, color, w) {
  if (!v.length) return; g.beginPath(); g.moveTo(v[0], v[1]);
  for (let i = 2; i < v.length; i += 2) g.lineTo(v[i], v[i + 1]);
  if (cerr) g.closePath(); g.strokeStyle = color; g.lineWidth = w; g.stroke();
}
function flecha(g, x1, y1, x2, y2, color, lw) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, a = Math.max(.45, 9 * lw);
  g.strokeStyle = g.fillStyle = color; g.lineWidth = 2 * lw;

  const pols = ED.ents.filter(e => e.k === "pl" && e.cerr && e.tipo);
  let At = 0, AC = 0; for (const t in tot) { At += tot[t]; if (t !== "sin_asignar") AC += tot[t] * (E.C[t] ?? 0); }
  const filas = Object.keys(TIPOS).filter(t => tot[t]).map(t => '<tr><td><i style="background:' + TIPOS[t][1] + '"></i>' + TIPOS[t][0] + '</td><td class="n">' + (E.C[t] != null ? E.C[t].toFixed(2) : "–") + '</td><td class="n">' + tot[t].toFixed(1) + "</td></tr>").join("");
  const At2 = At - (tot.sin_asignar || 0);
  let h = '<h3>Cuadro de superficies</h3><table class="tabla"><tr><th>Tipo</th><th class="n">C</th><th class="n">m²</th></tr>' + filas +
    '<tr><td><b>Total dentro del cerco</b></td><td class="n">' + (At2 ? (AC / At2).toFixed(3) : "–") + '</td><td class="n"><b>' + At.toFixed(1) + "</b></td></tr></table>";
  h += '<p class="nota">C ponderado sin contar las áreas sin asignar. Haga clic dentro de un área con <b>Asignar área (H)</b> para darle su tipo.</p>';
  if (pols.length) h += "<h3>Polígonos dibujados</h3>" + pols.map(e => '<div class="nota"><i style="display:inline-block;width:10px;height:10px;background:' + TIPOS[e.tipo][1] + '"></i> ' + TIPOS[e.tipo][0] + ": " + Math.abs(areaPol(e.pts)).toFixed(2) + " m²</div>").join("");
  sin.sort((a, b) => b.area - a.area);
  h += "<h3>Áreas sin asignar (" + sin.length + ")</h3>";
  h += sin.length ? '<div class="lista-sin">' + sin.slice(0, 40).map(c => '<button type="button" data-ir="' + c.id + '"><span>Área ' + c.id + "</span><span>" + c.area.toFixed(1) + " m²</span></button>").join("") + "</div>" : '<p class="nota">Todas las áreas tienen tipo.</p>';
  document.getElementById("hSup").innerHTML = h;
  document.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => irA(+b.dataset.ir));
  // capas
  const hc = document.getElementById("hCapas");
  hc.innerHTML = '<label class="capa"><input type="checkbox" id="chkSup"' + (verSup ? " checked" : "") + '><i style="background:var(--warn)"></i><span>Mapa de superficies</span><small></small></label>' +
    capas.map((c, k) => '<div class="capa"><input type="checkbox" id="capa' + k + '" data-k="' + k + '"' + (c.visible ? " checked" : "") + '><i style="background:' + c.grupos[0].color + '"></i><label for="capa' + k + '" title="' + c.nombre + '">' + c.nombre + "</label><small>" + c.n + "</small></div>").join("");
  document.getElementById("chkSup").onchange = ev => { verSup = ev.target.checked; dibujarBase(); };
  hc.querySelectorAll("input[data-k]").forEach(i => i.onchange = () => { capas[+i.dataset.k].visible = i.checked; dibujarBase(); });
  // ediciones
  const ex = exportar();
  document.getElementById("hEd").innerHTML = "<h3>Lo marcado en el visor</h3><table class=\"tabla\">" +
    [["Áreas asignadas por clic", ex.asignaciones.length], ["Polígonos de superficie", ex.superficies.length], ["Flechas de caída", ex.flechas_techo.length],
     ["Ejes de cuneta", ex.ejes_lineas.length], ["Descargas fijadas", ex.descargas.length], ["Otras líneas", ex.lineas.length]].map(r => "<tr><td>" + r[0] + '</td><td class="n">' + r[1] + "</td></tr>").join("") +
    '</table><p class="nota">Esto es lo que el motor de DrenIE suma al proyecto (archivo ediciones.json). Se guarda solo en este navegador mientras trabaja.</p>' +
    '<div class="grupo" style="flex-wrap:wrap;margin:8px 0"><button type="button" id="btnCopiar">Copiar ediciones</button>' +
    (location.protocol === "file:" ? '<button type="button" id="btnGuardar">Guardar ediciones.json</button>' : "") + "</div>" +
    '<textarea id="txtEd" aria-label="Ediciones en formato JSON" readonly></textarea>' +
    '<h3>Traer ediciones</h3><p class="nota">Pegue aquí un ediciones.json para seguir trabajando sobre él.</p><textarea id="txtImp" aria-label="Pegar ediciones"></textarea><button type="button" id="btnImp">Cargar lo pegado</button>';
  document.getElementById("txtEd").value = JSON.stringify(ex, null, 1);
  document.getElementById("btnCopiar").onclick = () => {
    const t = JSON.stringify(ex, null, 1);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => msg("Ediciones copiadas."), () => { const a = document.getElementById("txtEd"); a.focus(); a.select(); msg("Seleccione el texto y cópielo con Ctrl+C."); });
  };
  const bg = document.getElementById("btnGuardar");
  if (bg) bg.onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(ex, null, 1)], { type: "application/json" })); a.download = "ediciones.json"; a.click(); };
  document.getElementById("btnImp").onclick = () => importar(document.getElementById("txtImp").value);
}
function importar(texto) {
  let d; try { d = JSON.parse(texto); } catch (e) { return msg("El texto pegado no es un JSON válido."); }
  guardarPaso(); const L = p => [p[0] - ORX, p[1] - ORY];
  for (const a of d.asignaciones || []) { const p = L([a.x, a.y]), c = caraEn(p); ED.asign.push({ cara: c ? c.id : -1, x: p[0], y: p[1], tipo: a.tipo }); }
  for (const s of d.superficies || []) nuevaEnt("pl", s.poligono.map(L), { cerr: true, tipo: s.tipo, nombre: s.nombre });
  for (const f of d.flechas_techo || []) nuevaEnt("flecha", [L(f.desde), L(f.hacia)]);
  for (const l of d.ejes_lineas || []) nuevaEnt("cuneta", l.map(L));
  for (const q of d.descargas || []) nuevaEnt("descarga", [L([q.x, q.y])]);
  for (const l of d.lineas || []) nuevaEnt(l.cerrada ? "pl" : "linea", l.puntos.map(L), { cerr: !!l.cerrada });
  msg("Ediciones cargadas."); refrescar();
}
function irA(id) {
  const c = caras.find(q => q.id === id); if (!c) return;
  V.cx = (c.bb[0] + c.bb[2]) / 2; V.cy = (c.bb[1] + c.bb[3]) / 2;
  V.s = Math.min(W / Math.max(4, (c.bb[2] - c.bb[0]) * 3), H / Math.max(4, (c.bb[3] - c.bb[1]) * 3));
  dibujarBase(); dibujarSup(); msg("Área " + id + ": " + c.area.toFixed(2) + " m² sin asignar. Use Asignar área (H) y haga clic dentro.");
  if (window.innerWidth <= 760) lado.setAttribute("data-cerrado", "");
}

/* ====================================================================================== entrada de raton, tacto y teclado */
let arrastre = null; const toques = new Map();
cs.addEventListener("pointerdown", ev => {
  cs.setPointerCapture(ev.pointerId); toques.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (toques.size === 2) { arrastre = { tipo: "pellizco" }; return; }
  arrastre = { x: ev.offsetX, y: ev.offsetY, cx: V.cx, cy: V.cy, boton: ev.button, mov: false };
});
cs.addEventListener("pointermove", ev => {
  raton = [ev.offsetX, ev.offsetY];
  if (toques.has(ev.pointerId)) toques.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (arrastre && arrastre.tipo === "pellizco" && toques.size === 2) {
    const [a, b] = [...toques.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (arrastre.d) { const w = aMundo(m[0], m[1]); V.s *= d / arrastre.d; const w2 = aMundo(m[0], m[1]); V.cx += w[0] - w2[0]; V.cy += w[1] - w2[1];
      if (arrastre.m) { V.cx -= (m[0] - arrastre.m[0]) / V.s; V.cy += (m[1] - arrastre.m[1]) / V.s; } dibujarBase(); }
    arrastre.d = d; arrastre.m = m; return;
  }
  if (arrastre && (arrastre.boton === 1 || arrastre.boton === 0) && Math.hypot(ev.offsetX - arrastre.x, ev.offsetY - arrastre.y) > 4 && (arrastre.boton === 1 || !C || ev.pointerType === "touch")) {
    arrastre.mov = true; V.cx = arrastre.cx - (ev.offsetX - arrastre.x) / V.s; V.cy = arrastre.cy + (ev.offsetY - arrastre.y) / V.s; dibujarBase();
  }
  cursor = aMundo(ev.offsetX, ev.offsetY);
  const u = C && C.pts && C.pts.length ? C.pts[C.pts.length - 1] : (C && C.base) || null;
  snap = (C && !arrastre) || (C && arrastre && !arrastre.mov) ? buscarSnap(cursor[0], cursor[1], u) : null;
  const p = puntoActual();
  document.getElementById("coord").textContent = "X " + (p[0] + ORX).toFixed(3) + "  Y " + (p[1] + ORY).toFixed(3);
  document.getElementById("modoSnap").textContent = snap ? { fin: "punto final", medio: "punto medio", inter: "intersección", perp: "perpendicular", cerca: "cercano" }[snap.tipo] : "";
  dibujarSup();
});
cs.addEventListener("pointerup", ev => {
  toques.delete(ev.pointerId);
  const a = arrastre; arrastre = toques.size ? arrastre : null;
  if (!a || a.tipo === "pellizco") return;
  if (ev.button === 2) { ev.preventDefault(); return enter(); }
  if (a.mov || ev.button === 1) return;
  if (C && C.nombre === "tipoPol") return;
  if (C) punto(puntoActual());
});
cs.addEventListener("contextmenu", ev => ev.preventDefault());
cs.addEventListener("pointerleave", () => { raton = [-100, -100]; dibujarSup(); });
cs.addEventListener("wheel", ev => {
  ev.preventDefault(); const w = aMundo(ev.offsetX, ev.offsetY), f = Math.exp(-ev.deltaY * 0.0015);
  V.s = Math.max(0.05, Math.min(5000, V.s * f)); const w2 = aMundo(ev.offsetX, ev.offsetY); V.cx += w[0] - w2[0]; V.cy += w[1] - w2[1];
  dibujarBase(); dibujarSup();
}, { passive: false });
cs.addEventListener("dblclick", ev => { if (ev.button === 1) { verExtension(); dibujarBase(); } });

function interpretar(txt) {       // coordenadas escritas: x,y  @dx,dy  @d<ang  o una distancia en la direccion del cursor
  const t = txt.trim().replace(/\s+/g, ""); if (!t) return null;
  const u = ultimoPunto();
  let m;
  if ((m = t.match(/^@(-?[\d.]+)<(-?[\d.]+)$/)) && u) { const d = +m[1], a = +m[2] * Math.PI / 180; return [u[0] + d * Math.cos(a), u[1] + d * Math.sin(a)]; }
  if ((m = t.match(/^@(-?[\d.]+),(-?[\d.]+)$/)) && u) return [u[0] + +m[1], u[1] + +m[2]];
  if ((m = t.match(/^(-?[\d.]+),(-?[\d.]+)$/))) { let x = +m[1], y = +m[2]; if (Math.abs(x) > 10000) { x -= ORX; y -= ORY; } return [x, y]; }
  if ((m = t.match(/^-?[\d.]+$/)) && u && cursor) {
    const q = aplicarOrto(cursor), dx = q[0] - u[0], dy = q[1] - u[1], L = Math.hypot(dx, dy) || 1, d = +t; return [u[0] + dx / L * d, u[1] + dy / L * d];
  }
  return null;
}
entrada.addEventListener("keydown", ev => {
  if (ev.key === "Enter" || (ev.key === " " && !entrada.value)) {
    ev.preventDefault(); const v = entrada.value.trim(); entrada.value = "";
    if (!v) return enter();
    if (paleta && /^[1-7]$/.test(v)) { const el = paleta._elegir; ocultarPaleta(); return el(ASIGNABLES[+v - 1]); }
    if (C && /^c$/i.test(v)) return cerrar();
    if (C && C.nombre !== "tipoPol") { const p = interpretar(v); if (p) return punto(p); }
    if (C && !ALIAS[v.toUpperCase()]) return msg("Entrada no válida. Escriba un punto (x,y  @dx,dy  @dist<ángulo) o una distancia.");
    return iniciar(v);
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { entrada.value = ""; return cancelar(); }
  if (ev.key === "F3") { ev.preventDefault(); osnapOn = !osnapOn; estadoBotones(); msg("<OSNAP " + (osnapOn ? "activado" : "desactivado") + ">"); return; }
  if (ev.key === "F8") { ev.preventDefault(); ortoOn = !ortoOn; estadoBotones(); msg("<ORTO " + (ortoOn ? "activado" : "desactivado") + ">"); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); return deshacer(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "y") { ev.preventDefault(); return rehacer(); }
  if (paleta && /^[1-7]$/.test(ev.key) && document.activeElement !== entrada) { const el = paleta._elegir; ocultarPaleta(); return el(ASIGNABLES[+ev.key - 1]); }
  // como en AutoCAD, escribir en cualquier momento va a la linea de comando
  if (document.activeElement !== entrada && !ev.ctrlKey && !ev.metaKey && ev.key.length === 1 && !/^(INPUT|TEXTAREA|BUTTON)$/.test(document.activeElement.tagName)) entrada.focus();
});
function estadoBotones() { document.getElementById("btnOsnap").classList.toggle("on", osnapOn); document.getElementById("btnOrto").classList.toggle("on", ortoOn); }
document.getElementById("btnOsnap").onclick = () => { osnapOn = !osnapOn; estadoBotones(); };
document.getElementById("btnOrto").onclick = () => { ortoOn = !ortoOn; estadoBotones(); };
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => { iniciar(b.dataset.cmd); entrada.focus({ preventScroll: true }); });
const lado = document.getElementById("lado");
if (window.innerWidth > 760) lado.removeAttribute("data-cerrado");
document.getElementById("btnLado").onclick = () => lado.toggleAttribute("data-cerrado");
document.querySelectorAll(".pestanas button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".pestanas button").forEach(x => x.classList.toggle("on", x === b));
  for (const id of ["hSup", "hCapas", "hEd"]) document.getElementById(id).hidden = id !== b.dataset.hoja;
});
new ResizeObserver(dimensionar).observe(lienzo);

/* ====================================================================================== arranque */
(function () {
  let d = null; try { d = JSON.parse(document.getElementById("escena-datos").textContent); } catch (e) {}
  dimensionar();
  if (d) { cargarEscena(d); recuperar(); refrescar(); msg("Escena cargada: " + caras.length + " áreas, " + capas.length + " capas. Escriba un comando o use la barra de arriba."); }
  else {
    msg("Abra la escena del proyecto (escena.json que genera el motor de DrenIE).");
    const i = document.createElement("input"); i.type = "file"; i.accept = ".json"; i.id = "abrirEscena";
    i.onchange = () => { const r = new FileReader(); r.onload = () => { cargarEscena(JSON.parse(r.result)); recuperar(); refrescar(); }; r.readAsText(i.files[0]); };
    document.querySelector(".linea-cmd").appendChild(i);
  }
})();
